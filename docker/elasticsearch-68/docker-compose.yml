---
volumes:
  elasticsearch_data:

services:

  elasticsearch:
    image: elasticsearch:latest
    env_file: etc/environment
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:63200:9200"
    restart: unless-stopped
